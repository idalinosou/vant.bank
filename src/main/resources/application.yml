server:
  port: 8084

spring:
  application:
    name: vant.bank
  datasource:
    url: jdbc:h2:file:./dados/vantbank;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
